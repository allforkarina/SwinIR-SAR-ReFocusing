# E007: determine whether per-patch phase correction can explain refocusing.
experiment: E007-D001-per-patch-phase-oracle

data:
  expected_shape: [512, 512]
  rms_epsilon: 1.0e-12
  validation_region: {row_min: 16400, row_max: 18400, col_min: 7700, col_max: 9700}
  guard_region: {row_min: 15888, row_max: 18912, col_min: 7188, col_max: 10212}
  expected_split_counts: {train: 15714, guard: 520, validation: 441}
  oracle_sample_count: 64

phase:
  fft_norm: ortho
  maximum_shift_pixels: 96
  maximum_frequency_samples: 8192
  quadratic_coefficient_bound_radians: 402.1238596594935
  optimizer_max_iterations: 200
  optimizer_ftol: 1.0e-10
  optimizer_gtol: 1.0e-8

evaluation:
  log_magnitude_floor_db: -60.0
  high_frequency_radius_fraction: 0.25
  audit_sample_count: 12
  success_criteria:
    unrestricted_rmse_win_fraction_vs_echo_min: 0.90
    unrestricted_mean_coherence_delta_vs_echo_min: 0.20
    unrestricted_mean_log_ssim_delta_vs_echo_min: 0.15
    unrestricted_mean_edge_correlation_delta_vs_echo_min: 0.15
    unrestricted_median_high_frequency_energy_ratio_min: 0.75
    unrestricted_median_high_frequency_energy_ratio_max: 1.25
    quadratic_rmse_win_fraction_vs_echo_min: 0.75
    quadratic_mean_coherence_delta_vs_echo_min: 0.10
    quadratic_mean_log_ssim_delta_vs_echo_min: 0.08
    quadratic_mean_edge_correlation_delta_vs_echo_min: 0.08
    quadratic_median_high_frequency_energy_ratio_min: 0.75
    quadratic_median_high_frequency_energy_ratio_max: 1.25
    quadratic_fraction_of_unrestricted_ssim_gain_min: 0.50
    quadratic_fraction_of_unrestricted_edge_gain_min: 0.50

runtime:
  progress_interval_samples: 8
  figure_dpi: 160
  contact_sheet_page_size: 6
