# E013-B: expand the deterministic curriculum subset from 128 to 512 samples.
experiment: E013-B-D001-curriculum-512-phase-subset

model:
  img_size: 512
  patch_size: 1
  in_chans: 2
  embed_dim: 180
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 8
  mlp_ratio: 2.0
  qkv_bias: true
  qk_scale: null
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.0
  ape: false
  patch_norm: true
  use_checkpoint: false
  upscale: 1
  img_range: 1.0
  upsampler: ""
  resi_connection: "1conv"

data:
  expected_shape: [512, 512]
  rms_epsilon: 1.0e-12
  fft_norm: ortho
  representation: fftshifted_echo_complex_spectrum_to_unit_phase_correction

selection:
  source_split: train
  sample_count: 512
  anchor_filename: patch_row_10000_col_3000_2.mat
  validation_region: {row_min: 16400, row_max: 18400, col_min: 7700, col_max: 9700}
  guard_region: {row_min: 15888, row_max: 18912, col_min: 7188, col_max: 10212}
  expected_split_counts: {train: 15714, guard: 520, validation: 441}

initialization:
  mode: raw_and_ema_weights_only
  expected_source_experiment: E013-A-D001-curriculum-128-phase-subset
  expected_source_sample_count: 128

optimization:
  optimizer: adam
  learning_rate: 2.0e-4
  betas: [0.9, 0.99]
  epsilon: 1.0e-8
  weight_decay: 0.0
  phase_loss_weight: 1.0
  complex_reconstruction_weight: 0.25
  log_magnitude_weight: 0.25
  phase_energy_weight_power: 0.5
  phasor_epsilon: 1.0e-6
  charbonnier_epsilon: 1.0e-3
  ema_decay: 0.999

runtime:
  seed: 42
  steps: 256000
  eval_every: 25600
  save_every: 51200
  required_consecutive_successes: 3
  stop_on_success: false

evaluation:
  log_magnitude_floor_db: -60.0
  high_frequency_radius_fraction: 0.25
  probe_sample_indices: [0, 1, 7, 15, 31, 63, 64, 95, 127, 128, 191, 255, 256, 383, 447, 511]
  artifact_sample_indices: [0, 31, 63, 64, 95, 127, 128, 255, 256, 383, 511]
  success_criteria:
    weighted_phase_alignment_min: 0.95
    coherence_fraction_of_oracle_min: 0.90
    ssim_gain_fraction_of_oracle_min: 0.80
    edge_gain_fraction_of_oracle_min: 0.75
    rmse_excess_over_oracle_max: 0.08
    high_frequency_energy_ratio_min: 0.75
    high_frequency_energy_ratio_max: 1.25
