# E009: jointly overfit one Echo-only phase-correction predictor on 16 patches.
model:
  img_size: 512
  patch_size: 1
  in_chans: 2
  embed_dim: 180
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 8
  mlp_ratio: 2.0
  qkv_bias: true
  qk_scale: null
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  ape: false
  patch_norm: true
  use_checkpoint: false
  upscale: 1
  img_range: 1.0
  upsampler: ""
  resi_connection: "1conv"

data:
  expected_shape: [512, 512]
  rms_epsilon: 1.0e-12
  fft_norm: ortho
  representation: fftshifted_echo_complex_spectrum_to_unit_phase_correction

optimization:
  optimizer: adam
  learning_rate: 2.0e-4
  betas: [0.9, 0.99]
  epsilon: 1.0e-8
  weight_decay: 0.0
  phase_loss_weight: 1.0
  complex_reconstruction_weight: 0.25
  log_magnitude_weight: 0.25
  phase_energy_weight_power: 0.5
  phasor_epsilon: 1.0e-6
  charbonnier_epsilon: 1.0e-3
  ema_decay: 0.999

evaluation:
  log_magnitude_floor_db: -60.0
  high_frequency_radius_fraction: 0.25
